name: Build and Publish Firmware

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: pip install esphome==2026.3.1

      - name: Compile ESPHome Firmware for 3248W535
        run: esphome compile src/main_3248w535.yaml

      - name: Compile ESPHome Firmware for 4848S040
        run: esphome compile src/main_4848s040.yaml

      - name: Prepare Files for Pages and Release
        run: |
          set -e

          mkdir -p public
          VERSION="${{ github.ref_name }}"

          DEVICE1="3248w535"
          DEVICE2="4848s040"

          NAME1="stove3248w535"
          NAME2="stove4848s040"

          OTA1_BIN="stove-${DEVICE1}-${VERSION}-ota.bin"
          FACTORY1_BIN="stove-${DEVICE1}-${VERSION}-factory.bin"

          OTA2_BIN="stove-${DEVICE2}-${VERSION}-ota.bin"
          FACTORY2_BIN="stove-${DEVICE2}-${VERSION}-factory.bin"

          BUILD1_DIR="src/.esphome/build/${NAME1}"
          BUILD2_DIR="src/.esphome/build/${NAME2}"

          find "$BUILD1_DIR" -name "firmware.ota.bin" -exec cp {} "public/$OTA1_BIN" \;
          find "$BUILD1_DIR" -name "firmware.factory.bin" -exec cp {} "public/$FACTORY1_BIN" \;

          find "$BUILD2_DIR" -name "firmware.ota.bin" -exec cp {} "public/$OTA2_BIN" \;
          find "$BUILD2_DIR" -name "firmware.factory.bin" -exec cp {} "public/$FACTORY2_BIN" \;

          if [ ! -f "public/$OTA1_BIN" ]; then echo "Ошибка: OTA файл для $DEVICE1 не найден!"; exit 1; fi
          if [ ! -f "public/$FACTORY1_BIN" ]; then echo "Ошибка: Factory файл для $DEVICE1 не найден!"; exit 1; fi

          if [ ! -f "public/$OTA2_BIN" ]; then echo "Ошибка: OTA файл для $DEVICE2 не найден!"; exit 1; fi
          if [ ! -f "public/$FACTORY2_BIN" ]; then echo "Ошибка: Factory файл для $DEVICE2 не найден!"; exit 1; fi

          MD5_1=$(md5sum "public/$OTA1_BIN" | awk '{ print $1 }')
          MD5_2=$(md5sum "public/$OTA2_BIN" | awk '{ print $1 }')

          cat <<EOF > public/manifest_3248w535.json
          {
            "version": "$VERSION",
            "ota_url": "https://alaltitov.github.io/stove/$OTA1_BIN",
            "md5": "$MD5_1"
          }
          EOF

          cat <<EOF > public/manifest_4848s040.json
          {
            "version": "$VERSION",
            "ota_url": "https://alaltitov.github.io/stove/$OTA2_BIN",
            "md5": "$MD5_2"
          }
          EOF

          cat <<EOF > public/esphome-manifest-3248w535.json
          {
            "name": "alaltitov.stove.3248w535",
            "version": "$VERSION",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "https://alaltitov.github.io/stove/$FACTORY1_BIN", "offset": 0 }
                ]
              }
            ]
          }
          EOF

          cat <<EOF > public/esphome-manifest-4848s040.json
          {
            "name": "alaltitov.stove.4848s040",
            "version": "$VERSION",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "https://alaltitov.github.io/stove/$FACTORY2_BIN", "offset": 0 }
                ]
              }
            ]
          }
          EOF

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            public/*.bin
            public/manifest_*.json
            public/esphome-manifest-*.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
