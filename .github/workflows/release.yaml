name: Build and Release Firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    env:
      PROJECT_NAME: guition-stove

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install esphome==2026.3.1

      - name: Compile firmware
        run: |
          esphome compile src/main.yaml

      - name: Show generated files
        run: |
          find . -type f \( -name "*.bin" -o -name "*.elf" \) | sort

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          mkdir -p release-assets

          FACTORY_BIN="$(find . -type f -name 'firmware.factory.bin' | head -n 1)"
          OTA_BIN="$(find . -type f -name 'firmware.ota.bin' | head -n 1)"

          if [[ -z "${FACTORY_BIN}" ]]; then
            echo "firmware.factory.bin not found"
            exit 1
          fi

          if [[ -z "${OTA_BIN}" ]]; then
            echo "firmware.ota.bin not found"
            exit 1
          fi

          cp "${FACTORY_BIN}" "release-assets/${PROJECT_NAME}-${TAG}.factory.bin"
          cp "${OTA_BIN}" "release-assets/${PROJECT_NAME}-${TAG}.ota.bin"

          ls -lah release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.bin
