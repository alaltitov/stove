name: Build and Publish Firmware

on:
  push:
    tags:
      - 'v*' # Запуск при git push origin v...

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешение для Pages и добавления файлов в Релиз

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: pip install esphome

      - name: Compile ESPHome Firmware
        run: esphome compile src/main.yaml

      - name: Prepare Files for Pages and Release
        run: |
          mkdir public
          VERSION="${{ github.ref_name }}"
          OTA_BIN="stove-${VERSION}-ota.bin"
          FACTORY_BIN="stove-${VERSION}-factory.bin"
          
          # Ищем и копируем оба файла
          find src/.esphome/build/stove -name "firmware.ota.bin" -exec cp {} public/$OTA_BIN \;
          find src/.esphome/build/stove -name "firmware.factory.bin" -exec cp {} public/$FACTORY_BIN \;
          
          # Защита от ошибок: проверяем, что файлы реально скопировались
          if [ ! -f "public/$OTA_BIN" ]; then echo "Ошибка: OTA файл не найден!"; exit 1; fi
          if [ ! -f "public/$FACTORY_BIN" ]; then echo "Ошибка: Factory файл не найден!"; exit 1; fi
          
          # Считаем MD5 ИМЕННО для OTA-файла (его качает печь)
          MD5_HASH=$(md5sum public/$OTA_BIN | awk '{ print $1 }')
          
          # Создаем manifest.json (для вашей печи)
          cat <<EOF > public/manifest.json
          {
            "version": "$VERSION",
            "ota_url": "https://alaltitov.github.io/stove/$OTA_BIN",
            "md5": "$MD5_HASH"
          }
          EOF
          
          # Создаем esphome-manifest.json (для Web Install)
          # Важно: factory.bin всегда шьется с offset 0
          cat <<EOF > public/esphome-manifest.json
          {
            "name": "alaltitov.stove",
            "version": "$VERSION",
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "https://alaltitov.github.io/stove/$FACTORY_BIN", "offset": 0 }
                ]
              }
            ]
          }
          EOF

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            public/stove-*-ota.bin
            public/stove-*-factory.bin

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true

