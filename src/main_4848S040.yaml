substitutions:
  display_name: "stove4848S040"
  stove_version: "2026.4.4"
  stove_name: "Печь"
  stove_temp_sensor_id: max6675_temp

  stove_min_temp: "5"
  stove_max_temp: "230"
  stove_temp_step: "1"
  stove_default_temp: "35"

  stove_hysteresis_min: "1"
  stove_hysteresis_max: "30"
  stove_default_hysteresis: "3"

  stove_reach_stable_seconds: "5"

  update_info_url: "https://alaltitov.github.io/stove/manifest_4848S040.json"

  plus_icon: "\U000F0415"
  minus_icon: "\U000F0374"
  settings_icon: "\U000F08BB"
  alarm_icon: "\U000F009E"
  wifi_icon: "\U000F05A9"
  back_icon: "\U000F0156"
  heat_icon: "\U000F0238"
  check_icon: "\U000F012C"

esphome:
  name: ${display_name}
  project:
    name: "alaltitov.stove"
    version: "${stove_version}"
  on_boot:
    priority: -10
    then:
      - lambda: |-
          ESP_LOGI("stove_boot", "Boot: forcing relays OFF and resetting stove state");
      - switch.turn_off: stove_heat_relay
      - switch.turn_off: stove_alarm_relay
      - climate.control:
          id: stove_thermostat
          mode: "OFF"
          target_temperature: ${stove_default_temp}
      - script.execute: stove_reset_all
      - script.execute: stove_update_arc_range
      - script.execute: stove_refresh_wifi_info
      - script.execute: stove_apply_theme
      - lambda: |-
          id(stove_update_available_cached) = false;
          id(stove_update_latest_version).clear();
          id(stove_update_info_ok) = false;
          id(stove_update_md5).clear();
          id(stove_update_ota_url).clear();
      - lvgl.bar.update:
          id: boot_progress_bar
          value: 0
      - lvgl.widget.show: boot_overlay
      - lvgl.widget.show: boot_widget
      - lambda: |-
          lv_obj_clear_flag(id(boot_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(boot_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(boot_overlay));
          lv_obj_move_foreground(id(boot_widget));
      - delay: 1s
      - lvgl.bar.update:
          id: boot_progress_bar
          value: 25
      - delay: 1s
      - lvgl.bar.update:
          id: boot_progress_bar
          value: 50
      - delay: 1s
      - lvgl.bar.update:
          id: boot_progress_bar
          value: 75
      - delay: 1s
      - lvgl.bar.update:
          id: boot_progress_bar
          value: 100
      - delay: 200ms
      - lvgl.widget.hide: boot_widget
      - lvgl.widget.hide: boot_overlay
      - script.execute: stove_ui_refresh_all

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
    advanced:
      execute_from_psram: true

psram:
  mode: octal
  speed: 80MHz

api:
  reboot_timeout: 0s

logger:
  level: info

http_request:
  verify_ssl: true
  timeout: 10s
  buffer_size_rx: 1024

ota:
  - platform: esphome
    id: ota_state
    on_begin: &ota_begin
      - logger.log: "OTA Start"
      - light.turn_on: display_backlight
      - lambda: "id(display_backlight).loop();"
      - lvgl.resume:
      - lvgl.label.update:
          id: ota_label_primary
          text: "Идет обновление"
      - lvgl.label.update:
          id: ota_label_secondary
          text: "Подготовка прошивки..."
      - lvgl.label.update:
          id: ota_percent_label
          text: "0%"
      - lvgl.label.update:
          id: ota_bottom_hint
          text: "Не выключайте питание"
      - lvgl.bar.update:
          id: ota_bar_value
          value: 0
      - lvgl.widget.show: ota_overlay
      - lvgl.widget.show: ota_widget
      - lambda: |-
          lv_obj_clear_flag(id(ota_overlay), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(ota_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_move_foreground(id(ota_overlay));
          lv_obj_move_foreground(id(ota_widget));
          lv_refr_now(NULL);
      - logger.log: "OTA widget shown"

    on_progress: &ota_progress
      - lvgl.bar.update:
          id: ota_bar_value
          value: !lambda return (int)x;
      - lvgl.label.update:
          id: ota_label_primary
          text: "Идет обновление"
      - lvgl.label.update:
          id: ota_label_secondary
          text: "Загрузка прошивки"
      - lvgl.label.update:
          id: ota_percent_label
          text: !lambda |-
            static char buffer[16];
            snprintf(buffer, sizeof(buffer), "%d%%", (int)x);
            return buffer;
      - lambda: |-
          lv_refr_now(NULL);

    on_end: &ota_end
      - logger.log: "OTA End"
      - lvgl.bar.update:
          id: ota_bar_value
          value: 100
      - lvgl.label.update:
          id: ota_label_primary
          text: "Обновление завершено"
      - lvgl.label.update:
          id: ota_label_secondary
          text: "Устройство перезагрузится"
      - lvgl.label.update:
          id: ota_percent_label
          text: "100%"
      - lvgl.label.update:
          id: ota_bottom_hint
          text: "Почти готово"
      - lambda: |-
          lv_refr_now(NULL);

    on_error: &ota_error
      - logger.log:
          format: "OTA update error %d"
          args: ["x"]
      - lvgl.label.update:
          id: ota_label_primary
          text: "Ошибка обновления"
      - lvgl.label.update:
          id: ota_label_secondary
          text: "Не удалось загрузить прошивку"
      - lvgl.label.update:
          id: ota_bottom_hint
          text: !lambda |-
            static char buffer[64];
            snprintf(buffer, sizeof(buffer), "Код ошибки: %d", x);
            return buffer;
      - lambda: |-
          lv_refr_now(NULL);

  - platform: http_request
    id: ota_http_request
    on_begin: *ota_begin
    on_progress: *ota_progress
    on_end: *ota_end
    on_error: *ota_error

wifi:
  ap:
    ssid: "Stove-Hotspot"
    password: "01234567"
  on_connect:
    then:
      - lambda: |-
          id(stove_wifi_connected) = true;
      - script.execute: stove_refresh_wifi_info
      - script.execute: stove_ui_update_wifi_icon
      - script.execute: stove_update_wifi_modal
  on_disconnect:
    then:
      - lambda: |-
          id(stove_wifi_connected) = false;
      - script.execute: stove_refresh_wifi_info
      - script.execute: stove_ui_update_wifi_icon
      - script.execute: stove_update_wifi_modal

