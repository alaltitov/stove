          condition:
            lambda: 'return id(stove_heating_output_state);'
          then:
            - lvgl.widget.show: stove_heat_indicator
          else:
            - lvgl.widget.hide: stove_heat_indicator

  - id: stove_ui_update_wifi_icon
    then:
      - lambda: |-
          if (id(stove_wifi_connected)) {
            lv_obj_set_style_text_color(id(stove_wifi_icon_ui), lv_color_hex(id(stove_theme_color_hex)), 0);
          } else {
            lv_obj_set_style_text_color(id(stove_wifi_icon_ui), lv_color_hex(0x808080), 0);
          }

  - id: stove_ui_show_cycle_finished_modal
    then:
      - lambda: |-
          id(stove_cycle_modal_open) = true;
          ESP_LOGI("stove_ui", "Show cycle finished modal");
      - lvgl.widget.show: stove_cycle_modal_overlay
      - lvgl.widget.show: stove_cycle_modal
      - lambda: |-
          lv_obj_move_foreground(id(stove_cycle_modal_overlay));
          lv_obj_move_foreground(id(stove_cycle_modal));
      - script.execute: stove_ui_update_alarm_blink

  - id: stove_ui_hide_cycle_finished_modal
    then:
      - lambda: |-
          id(stove_cycle_modal_open) = false;
          id(stove_alarm_blink_state) = false;
          ESP_LOGI("stove_ui", "Hide cycle finished modal");
      - lvgl.widget.hide: stove_cycle_modal
      - lvgl.widget.hide: stove_cycle_modal_overlay
      - script.execute: stove_ui_update_alarm_blink

  - id: stove_ui_update_alarm_blink
    then:
      - lambda: |-
          if (id(stove_cycle_finished) && id(stove_cycle_modal_open) && id(stove_alarm_blink_state)) {
            lv_obj_set_style_text_color(id(stove_modal_alarm_big), lv_color_hex(0xFF3B30), 0);
          } else if (id(stove_cycle_finished) && id(stove_cycle_modal_open)) {
            lv_obj_set_style_text_color(id(stove_modal_alarm_big), lv_color_hex(0x5A1A18), 0);
          } else {
            lv_obj_set_style_text_color(id(stove_modal_alarm_big), lv_color_hex(0xFF3B30), 0);
          }

  - id: stove_ui_refresh_all
    then:
      - script.execute: stove_ui_update_hysteresis_label
      - script.execute: stove_ui_update_target_temp_edit
      - script.execute: stove_ui_update_target_temp_main
      - script.execute: stove_ui_update_current_temp
      - script.execute: stove_ui_update_timer
      - script.execute: stove_ui_update_status
      - script.execute: stove_ui_update_start_stop
      - script.execute: stove_ui_update_heat_indicator
      - script.execute: stove_ui_update_wifi_icon

  - id: stove_open_settings_panel
    then:
