script:
  - id: stove_update_arc_range
    then:
      - lambda: |-
          if (id(stove_arc_range_initialized)) return;

          int min_scaled = ${stove_min_temp};
          int max_scaled = ${stove_max_temp};

          lv_arc_set_range(id(stove_arc_target_edit), min_scaled, max_scaled);
          lv_arc_set_range(id(stove_arc_main_current), min_scaled, max_scaled);
          lv_arc_set_range(id(stove_arc_current_temperature), min_scaled, max_scaled);
          lv_arc_set_range(id(stove_arc_main_timer), 0, 1000);

          int tgt = id(stove_target_temp);
          if (tgt < min_scaled) tgt = min_scaled;
          if (tgt > max_scaled) tgt = max_scaled;
          lv_arc_set_value(id(stove_arc_target_edit), tgt);

          if (id(${stove_temp_sensor_id}).has_state()) {
            int cur = (int)(id(${stove_temp_sensor_id}).state + 0.5f);
            if (cur < min_scaled) cur = min_scaled;
            if (cur > max_scaled) cur = max_scaled;
            lv_arc_set_value(id(stove_arc_main_current), cur);
            lv_arc_set_value(id(stove_arc_current_temperature), cur);
          } else {
            lv_arc_set_value(id(stove_arc_main_current), min_scaled);
            lv_arc_set_value(id(stove_arc_current_temperature), min_scaled);
          }

          lv_arc_set_value(id(stove_arc_main_timer), 0);

          id(stove_arc_range_initialized) = true;
          ESP_LOGI("stove_ui", "Arc range initialized");

  - id: stove_sync_climate
    then:
      - climate.control:
          id: stove_thermostat
          target_temperature: !lambda |-
            return id(stove_target_temp);

  - id: stove_refresh_wifi_info
    then:
      - lambda: |-
          std::string ip_text = "Нет подключения";

          auto addrs = esphome::network::get_ip_addresses();
          for (auto &addr : addrs) {
            if (addr.is_set()) {
              char buf[esphome::network::IP_ADDRESS_BUFFER_SIZE];
              addr.str_to(buf);
              ip_text = buf;
              break;
            }
          }

          if (!id(stove_wifi_connected)) {
            ip_text = "Нет подключения";
          }

          id(stove_wifi_ip_text).publish_state(ip_text);

  - id: stove_fetch_update_info
    then:
      - lambda: |-
          id(stove_update_info_ok) = false;
          id(stove_update_md5).clear();
          id(stove_update_ota_url).clear();
          id(stove_update_available_cached) = false;
          id(stove_update_latest_version).clear();
          lv_label_set_text(id(stove_update_status_label_ui), "Проверка обновлений...");
          lv_obj_set_style_text_color(id(stove_update_button_label_ui), lv_color_hex(0x606682), 0);
      - http_request.get:
          url: ${update_info_url}
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (body.rfind("<!DOCTYPE html>", 0) == 0 || body.find("<html") != std::string::npos) {
                    ESP_LOGW("stove_update", "manifest.json URL returned HTML instead of JSON");
                    lv_label_set_text(id(stove_update_status_label_ui), "Ошибка манифеста");
                    return;
                  }

                  auto extract_json_string = [&](const std::string &src, const std::string &key) -> std::string {
                    std::string pattern = "\"" + key + "\"";
                    size_t k = src.find(pattern);
                    if (k == std::string::npos) return "";
                    size_t colon = src.find(':', k + pattern.size());
                    if (colon == std::string::npos) return "";
                    size_t first_quote = src.find('"', colon + 1);
                    if (first_quote == std::string::npos) return "";
                    size_t second_quote = src.find('"', first_quote + 1);
                    if (second_quote == std::string::npos) return "";
                    return src.substr(first_quote + 1, second_quote - first_quote - 1);
                  };

                  std::string ota_url = extract_json_string(body, "ota_url");
                  std::string md5 = extract_json_string(body, "md5");
                  std::string version = extract_json_string(body, "version");

                  if (ota_url.empty() || md5.empty()) {
                    ESP_LOGW("stove_update", "manifest.json missing ota_url or md5");
                    lv_label_set_text(id(stove_update_status_label_ui), "Нет данных обновления");
                    return;
                  }

                  id(stove_update_ota_url) = ota_url;
                  id(stove_update_md5) = md5;
                  id(stove_update_info_ok) = true;

                  if (!version.empty()) {
                    if (version.rfind("v", 0) == 0) {
                      id(stove_update_latest_version) = version.substr(1);
                    } else {
                      id(stove_update_latest_version) = version;
                    }

                    std::string remote_v = id(stove_update_latest_version);
                    std::string local_v = "${stove_version}";

                    if (remote_v != local_v) {
                      id(stove_update_available_cached) = true;
                      ESP_LOGI("stove_update", "UPDATE AVAILABLE: %s -> %s", local_v.c_str(), remote_v.c_str());
                    } else {
                      id(stove_update_available_cached) = false;
                      ESP_LOGI("stove_update", "Firmware is up to date.");
                    }
                  }

                  if (id(stove_update_available_cached)) {
                    std::string txt = "Есть обновление";
                    if (!id(stove_update_latest_version).empty()) {
                      txt += ": " + id(stove_update_latest_version);
                    }
                    lv_label_set_text(id(stove_update_status_label_ui), txt.c_str());
                    lv_obj_set_style_text_color(id(stove_update_button_label_ui), lv_color_hex(id(stove_theme_color_hex)), 0);
                  } else {
                    lv_label_set_text(id(stove_update_status_label_ui), "Нет обновлений");
                    lv_obj_set_style_text_color(id(stove_update_button_label_ui), lv_color_hex(0x606682), 0);
                  }

  - id: stove_run_firmware_update
    then:
      - lambda: |-
          if (!id(stove_update_available_cached)) {
            ESP_LOGI("stove_update", "No update available");
            lv_label_set_text(id(stove_update_status_label_ui), "Нет обновлений");
            return;
          }

          if (!id(stove_update_info_ok) || id(stove_update_ota_url).empty() || id(stove_update_md5).empty()) {
            ESP_LOGW("stove_update", "Update info is not ready yet");
            lv_label_set_text(id(stove_update_status_label_ui), "Нет данных для OTA");
            return;
          }
      - lambda: |-
          ESP_LOGI("stove_update", "Starting OTA via UI widget");
      - ota.http_request.flash:
          id: ota_http_request
          url: !lambda |-
            return id(stove_update_ota_url);
          md5: !lambda |-
            return id(stove_update_md5);

  - id: stove_apply_theme
    then:
      - lambda: |-
          switch (id(stove_theme_index)) {
            case 0: id(stove_theme_color_hex) = 0xFF6600; break;
            case 1: id(stove_theme_color_hex) = 0xE7C12C; break;
            case 2: id(stove_theme_color_hex) = 0xFF0000; break;
            case 3: id(stove_theme_color_hex) = 0x4C9FFF; break;
            case 4: id(stove_theme_color_hex) = 0x5CA848; break;
            default: id(stove_theme_color_hex) = 0xFF6600; break;
          }

          lv_color_t c = lv_color_hex(id(stove_theme_color_hex));

          lv_obj_set_style_arc_color(id(stove_arc_main_current), c, LV_PART_INDICATOR);
          lv_obj_set_style_arc_color(id(stove_arc_target_edit), c, LV_PART_INDICATOR);
          lv_obj_set_style_arc_color(id(stove_arc_main_timer), c, LV_PART_INDICATOR);
          lv_obj_set_style_border_color(id(stove_arc_target_edit), c, LV_PART_KNOB);
          lv_obj_set_style_bg_color(id(ota_bar_value), c, LV_PART_INDICATOR);
          lv_obj_set_style_bg_color(id(boot_progress_bar), c, LV_PART_INDICATOR);

          lv_obj_set_style_text_color(id(ota_percent_label), c, 0);
          lv_obj_set_style_text_color(id(stove_wifi_modal_ip), c, 0);
          lv_obj_set_style_text_color(id(stove_main_current_temp_label), c, 0);
          lv_obj_set_style_text_color(id(stove_temp_page_edit_label), c, 0);
          lv_obj_set_style_text_color(id(stove_main_start_stop_label), c, 0);

          if (id(stove_wifi_connected)) {
            lv_obj_set_style_text_color(id(stove_wifi_icon_ui), c, 0);
          } else {
            lv_obj_set_style_text_color(id(stove_wifi_icon_ui), lv_color_hex(0x808080), 0);
          }

          if (id(stove_update_available_cached)) {
            lv_obj_set_style_text_color(id(stove_update_button_label_ui), c, 0);
          } else {
            lv_obj_set_style_text_color(id(stove_update_button_label_ui), lv_color_hex(0x606682), 0);
          }

  - id: stove_apply_theme_preview
    then:
      - lambda: |-
          int theme_hex = 0xFF6600;
          switch (id(stove_theme_index_edit)) {
            case 0: theme_hex = 0xFF6600; break;
            case 1: theme_hex = 0xE7C12C; break;
            case 2: theme_hex = 0xFF0000; break;
            case 3: theme_hex = 0x4C9FFF; break;
            case 4: theme_hex = 0x5CA848; break;
            default: theme_hex = 0xFF6600; break;
          }

          id(stove_theme_color_hex) = theme_hex;
          lv_color_t c = lv_color_hex(theme_hex);

          lv_obj_set_style_arc_color(id(stove_arc_main_current), c, LV_PART_INDICATOR);
          lv_obj_set_style_arc_color(id(stove_arc_target_edit), c, LV_PART_INDICATOR);
          lv_obj_set_style_arc_color(id(stove_arc_main_timer), c, LV_PART_INDICATOR);
          lv_obj_set_style_border_color(id(stove_arc_target_edit), c, LV_PART_KNOB);
          lv_obj_set_style_bg_color(id(ota_bar_value), c, LV_PART_INDICATOR);
          lv_obj_set_style_bg_color(id(boot_progress_bar), c, LV_PART_INDICATOR);

          lv_obj_set_style_text_color(id(ota_percent_label), c, 0);
          lv_obj_set_style_text_color(id(stove_wifi_modal_ip), c, 0);
          lv_obj_set_style_text_color(id(stove_main_current_temp_label), c, 0);
          lv_obj_set_style_text_color(id(stove_temp_page_edit_label), c, 0);
          lv_obj_set_style_text_color(id(stove_main_start_stop_label), c, 0);

          if (id(stove_wifi_connected)) {
            lv_obj_set_style_text_color(id(stove_wifi_icon_ui), c, 0);
          } else {
            lv_obj_set_style_text_color(id(stove_wifi_icon_ui), lv_color_hex(0x808080), 0);
          }

          if (id(stove_update_available_cached)) {
            lv_obj_set_style_text_color(id(stove_update_button_label_ui), c, 0);
          } else {
            lv_obj_set_style_text_color(id(stove_update_button_label_ui), lv_color_hex(0x606682), 0);
          }

  - id: stove_ui_update_hysteresis_label
    then:
      - lambda: |-
          static char buf[16];
          snprintf(buf, sizeof(buf), "%d°", id(stove_hysteresis_edit));
          lv_label_set_text(id(stove_hysteresis_value_label), buf);

  - id: stove_ui_update_target_temp_edit
    then:
      - lambda: |-
          static char buf[16];
          snprintf(buf, sizeof(buf), "%d°", id(stove_target_temp_edit));
          lv_label_set_text(id(stove_temp_page_edit_label), buf);

  - id: stove_ui_update_target_temp_main
    then:
      - lambda: |-
          static char buf[16];
          snprintf(buf, sizeof(buf), "%d°", id(stove_target_temp));
          lv_label_set_text(id(stove_main_target_temp_label), buf);

  - id: stove_ui_update_current_temp
    then:
      - lambda: |-
          char buf[24];

          if (id(${stove_temp_sensor_id}).has_state()) {
            float current = id(${stove_temp_sensor_id}).state;
            snprintf(buf, sizeof(buf), "%.1f°", current);
            lv_label_set_text(id(stove_main_current_temp_label), buf);
            lv_label_set_text(id(stove_temp_page_current_label), buf);

            int minv = ${stove_min_temp};
            int maxv = id(stove_target_temp);
            if (maxv < minv + 1) maxv = minv + 1;
            lv_arc_set_range(id(stove_arc_main_current), minv, maxv);

            int arc_current = (int)(current + 0.5f);
            if (arc_current < minv) arc_current = minv;
            if (arc_current > maxv) arc_current = maxv;
            lv_arc_set_value(id(stove_arc_main_current), arc_current);

            int page_arc_current = (int)(current + 0.5f);
            if (page_arc_current < ${stove_min_temp}) page_arc_current = ${stove_min_temp};
            if (page_arc_current > ${stove_max_temp}) page_arc_current = ${stove_max_temp};
            lv_arc_set_value(id(stove_arc_current_temperature), page_arc_current);
          } else {
            lv_label_set_text(id(stove_main_current_temp_label), "--.-°");
            lv_label_set_text(id(stove_temp_page_current_label), "--.-°");
            lv_arc_set_value(id(stove_arc_main_current), ${stove_min_temp});
            lv_arc_set_value(id(stove_arc_current_temperature), ${stove_min_temp});
          }

  - id: stove_ui_update_timer
    then:
      - lambda: |-
          int set_total = (id(stove_timer_hours) * 3600) + (id(stove_timer_minutes) * 60);
          int elapsed = 0;
          int remaining = 0;

          if (id(stove_cycle_running) && id(stove_hold_started)) {
            remaining = id(stove_remaining_sec);
            elapsed = set_total - remaining;
            if (elapsed < 0) elapsed = 0;
          } else if (id(stove_cycle_finished)) {
            remaining = 0;
            elapsed = set_total;
          } else {
            remaining = set_total;
            elapsed = 0;
          }

          int scaled = 0;
          if (set_total > 0) {
            scaled = (elapsed * 1000) / set_total;
            if (scaled < 0) scaled = 0;
            if (scaled > 1000) scaled = 1000;
          }
          lv_arc_set_value(id(stove_arc_main_timer), scaled);

          char buf_remaining[24];
          int hh = remaining / 3600;
          int mm = (remaining % 3600) / 60;
          int ss = remaining % 60;
          snprintf(buf_remaining, sizeof(buf_remaining), "%02d:%02d:%02d", hh, mm, ss);
          lv_label_set_text(id(stove_main_remaining_label), buf_remaining);

  - id: stove_ui_update_status
    then:
      - lambda: |-
          const char* new_status = nullptr;
          lv_color_t status_color;

          if (id(stove_timer_invalid)) {
            new_status = "ЗАДАЙТЕ ТАЙМЕР";
            status_color = lv_color_hex(0xFF3B30);
          } else if (id(stove_cycle_finished)) {
            new_status = "ЦИКЛ ОКОНЧЕН";
            status_color = lv_color_hex(0x34C759);
          } else if (id(stove_cycle_running) && id(stove_hold_started)) {
            new_status = "ВЫДЕРЖКА";
            status_color = lv_color_hex(0xFFD60A);
          } else if (id(stove_cycle_running) && id(stove_target_reached_latch_sec) > 0) {
            static char buf[32];
            snprintf(buf, sizeof(buf), "СТАБИЛИЗАЦИЯ %d/%d",
                     id(stove_target_reached_latch_sec),
                     ${stove_reach_stable_seconds});
            new_status = buf;
            status_color = lv_color_hex(0xFFD60A);
          } else if (id(stove_cycle_running)) {
            new_status = "НАГРЕВ";
            status_color = lv_color_hex(0xFF6600);
          } else {
            new_status = "ОЖИДАНИЕ";
            status_color = lv_color_hex(0xC7D0E0);
          }

          lv_label_set_text(id(stove_top_status_label), new_status);
          lv_obj_set_style_text_color(id(stove_top_status_label), status_color, 0);

  - id: stove_ui_update_start_stop
    then:
      - lambda: |-
          const char* btn_text = (id(stove_cycle_running) || id(stove_cycle_finished)) ? "СТОП" : "СТАРТ";
          lv_label_set_text(id(stove_main_start_stop_label), btn_text);
          lv_obj_set_style_text_color(id(stove_main_start_stop_label), lv_color_hex(id(stove_theme_color_hex)), 0);

  - id: stove_ui_update_heat_indicator
    then:
