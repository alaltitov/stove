          id(stove_hysteresis_edit) = id(stove_hysteresis);
          id(stove_theme_index_edit) = id(stove_theme_index);
          ESP_LOGI("stove_ui", "Settings edit cancelled, restored hyst=%d theme=%d",
                   id(stove_hysteresis), id(stove_theme_index));
