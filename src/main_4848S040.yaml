text_sensor:
  - platform: template
    id: stove_status_text
    name: "Stove Status"
    lambda: |-
      if (id(stove_timer_invalid)) return {"Задайте таймер"};
      if (id(stove_cycle_finished)) return {"Цикл окончен"};
      if (id(stove_cycle_running) && id(stove_hold_started)) return {"Выдержка"};
      if (id(stove_cycle_running) && id(stove_target_reached_latch_sec) > 0) return {"Стабилизация"};
      if (id(stove_cycle_running)) return {"Нагрев"};
      return {"Ожидание"};

  - platform: template
    id: stove_wifi_ip_text
    name: "Stove WiFi IP"

switch:
  - platform: gpio
    id: stove_heat_relay
    name: "Stove Heat Relay"
    pin: GPIO40
    inverted: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: |-
          ESP_LOGI("stove_relay", "HEAT relay -> ON (GPIO40)");
      - script.execute: stove_ui_update_heat_indicator
    on_turn_off:
      - lambda: |-
          ESP_LOGI("stove_relay", "HEAT relay -> OFF (GPIO40)");
      - script.execute: stove_ui_update_heat_indicator

  - platform: gpio
    id: stove_alarm_relay
    name: "Stove Alarm Relay"
    pin: GPIO1
    inverted: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: |-
          ESP_LOGI("stove_relay", "ALARM relay -> ON (GPIO01)");
    on_turn_off:
      - lambda: |-
          ESP_LOGI("stove_relay", "ALARM relay -> OFF (GPIO01)");

button:
  - platform: template
    id: stove_theme_orange_button
    on_press:
      - lambda: |-
          id(stove_theme_index_edit) = 0;
      - script.execute: stove_apply_theme_preview

  - platform: template
    id: stove_theme_yellow_button
    on_press:
      - lambda: |-
          id(stove_theme_index_edit) = 1;
      - script.execute: stove_apply_theme_preview

  - platform: template
    id: stove_theme_red_button
    on_press:
