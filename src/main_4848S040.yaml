      - lvgl.widget.show: stove_wifi_modal
      - lambda: |-
          lv_obj_move_foreground(id(stove_wifi_modal_overlay));
          lv_obj_move_foreground(id(stove_wifi_modal));

  - id: stove_close_wifi_modal
