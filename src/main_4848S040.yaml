      - script.execute: stove_apply_theme_preview

sensor:
  - platform: max6675
    id: max6675_temp
    name: "Температура термопары"
    spi_id: lcd_spi
    cs_pin: GPIO42
    update_interval: 1s
    on_value:
      - lambda: |-
          ESP_LOGD("stove_temp", "MAX6675 temperature updated: %.2f", x);
      - script.execute: stove_ui_update_current_temp

  - platform: template
    id: stove_remaining_minutes_sensor
    name: "Stove Remaining Minutes"
    unit_of_measurement: "min"
    accuracy_decimals: 1
    lambda: |-
      return id(stove_remaining_sec) / 60.0f;

  - platform: wifi_signal
    id: stove_wifi_signal
    name: "Stove WiFi Signal"
    update_interval: 30s
    on_value:
      - script.execute: stove_refresh_wifi_info
      - script.execute: stove_ui_update_wifi_icon
      - script.execute: stove_update_wifi_modal

climate:
  - platform: thermostat
    id: stove_thermostat
    name: "${stove_name}"
    sensor: ${stove_temp_sensor_id}

    min_heating_off_time: 1s
    min_heating_run_time: 1s
    min_idle_time: 1s

    visual:
      min_temperature: ${stove_min_temp}
      max_temperature: ${stove_max_temp}
      temperature_step: ${stove_temp_step}

    startup_delay: true
    heat_deadband: 0.5
    heat_overrun: 0.5

    heat_action:
      - lambda: |-
          ESP_LOGI("stove_climate", "Thermostat heat_action fired");

    idle_action:
      - lambda: |-
          ESP_LOGI("stove_climate", "Thermostat idle_action fired");

interval:
  - interval: 1s
    then:
      - lambda: |-
          bool prev_heat = id(stove_heating_output_state);
          bool prev_alarm = id(stove_alarm_output_state);
          bool prev_hold_started = id(stove_hold_started);
          bool prev_cycle_running = id(stove_cycle_running);
          bool prev_cycle_finished = id(stove_cycle_finished);
          int prev_remaining = id(stove_remaining_sec);

          if (!id(stove_cycle_running)) {
            id(stove_target_reached_latch_sec) = 0;
            id(stove_heating_output_state) = false;
          } else if (!id(${stove_temp_sensor_id}).has_state()) {
            id(stove_target_reached_latch_sec) = 0;
            id(stove_heating_output_state) = false;
          } else {
            float current = id(${stove_temp_sensor_id}).state;
            float target = id(stove_target_temp);
            float h = id(stove_hysteresis);

            if (!id(stove_hold_started)) {
              if (current >= target) {
                id(stove_target_reached_latch_sec)++;
              } else {
                id(stove_target_reached_latch_sec) = 0;
              }

              if (id(stove_target_reached_latch_sec) >= ${stove_reach_stable_seconds}) {
                id(stove_hold_started) = true;
                id(stove_remaining_sec) = (id(stove_timer_hours) * 3600) + (id(stove_timer_minutes) * 60);
                id(stove_target_reached_latch_sec) = 0;
                ESP_LOGI("stove_cycle", "Hold started: timer=%d sec", id(stove_remaining_sec));
              }
            }

            if (!id(stove_cycle_finished)) {
              float low_border = target - h;
              float high_border = target + h;

              if (current <= low_border) {
                if (!id(stove_heating_output_state)) {
                  ESP_LOGI("stove_logic",
                           "Heating request ON: current=%.2f target=%.2f low=%.2f high=%.2f",
                           current, target, low_border, high_border);
                }
                id(stove_heating_output_state) = true;
              } else if (current >= high_border) {
                if (id(stove_heating_output_state)) {
                  ESP_LOGI("stove_logic",
                           "Heating request OFF: current=%.2f target=%.2f low=%.2f high=%.2f",
                           current, target, low_border, high_border);
                }
                id(stove_heating_output_state) = false;
              }
            }

            if (id(stove_hold_started) && id(stove_remaining_sec) > 0) {
              id(stove_remaining_sec)--;
            }

            if (id(stove_hold_started) && id(stove_remaining_sec) <= 0) {
              id(stove_remaining_sec) = 0;
              id(stove_cycle_running) = false;
              id(stove_hold_started) = false;
              id(stove_cycle_finished) = true;
              id(stove_heating_output_state) = false;
              id(stove_alarm_output_state) = true;
              ESP_LOGI("stove_cycle", "Cycle finished -> heating OFF, alarm ON");
            }
          }

          if (prev_heat != id(stove_heating_output_state)) {
            if (id(stove_heating_output_state)) {
              id(stove_heat_relay).turn_on();
            } else {
              id(stove_heat_relay).turn_off();
            }
          }

          if (prev_alarm != id(stove_alarm_output_state)) {
            if (id(stove_alarm_output_state)) {
              id(stove_alarm_relay).turn_on();
            } else {
              id(stove_alarm_relay).turn_off();
            }
          }

          if (prev_remaining != id(stove_remaining_sec) ||
              prev_hold_started != id(stove_hold_started) ||
              prev_cycle_finished != id(stove_cycle_finished) ||
              prev_cycle_running != id(stove_cycle_running)) {
            id(stove_remaining_minutes_sensor).publish_state(id(stove_remaining_sec) / 60.0f);
          }
      - script.execute: stove_ui_update_timer
      - script.execute: stove_ui_update_status
      - script.execute: stove_ui_update_start_stop
      - if:
          condition:
            lambda: 'return id(stove_cycle_finished) && !id(stove_cycle_modal_open);'
          then:
            - script.execute: stove_ui_show_cycle_finished_modal

  - interval: 500ms
    then:
      - if:
          condition:
            lambda: 'return id(stove_cycle_finished) && id(stove_cycle_modal_open);'
          then:
            - lambda: |-
                id(stove_alarm_blink_state) = !id(stove_alarm_blink_state);
            - script.execute: stove_ui_update_alarm_blink
          else:
            - if:
                condition:
                  lambda: 'return id(stove_alarm_blink_state);'
                then:
                  - lambda: |-
                      id(stove_alarm_blink_state) = false;
                  - script.execute: stove_ui_update_alarm_blink

lvgl:
  id: lvgl_component
  color_depth: 16
  byte_order: big_endian
  displays: ${display_name}
  touchscreens:
    - touchscreen_id: touchscreen_id

  top_layer:
    widgets:
      - obj:
          id: boot_overlay
          hidden: true
          x: 0
          y: 0
          width: 480
          height: 480
          align: top_left
          clickable: true
          bg_color: color_black
          bg_opa: 65%
          border_opa: transp
