script:
  - id: stove_update_arc_range
    then:
      - lambda: |-
          if (id(stove_arc_range_initialized)) return;

          int min_scaled = ${stove_min_temp};
          int max_scaled = ${stove_max_temp};

          lv_arc_set_range(id(stove_arc_target_edit), min_scaled, max_scaled);
          lv_arc_set_range(id(stove_arc_main_current), min_scaled, max_scaled);
          lv_arc_set_range(id(stove_arc_main_timer), 0, 1000);

          int tgt = id(stove_target_temp);
          if (tgt < min_scaled) tgt = min_scaled;
          if (tgt > max_scaled) tgt = max_scaled;
          lv_arc_set_value(id(stove_arc_target_edit), tgt);

          if (id(${stove_temp_sensor_id}).has_state()) {
            int cur = (int)(id(${stove_temp_sensor_id}).state + 0.5f);
            if (cur < min_scaled) cur = min_scaled;
            if (cur > max_scaled) cur = max_scaled;
            lv_arc_set_value(id(stove_arc_main_current), cur);
          } else {
            lv_arc_set_value(id(stove_arc_main_current), min_scaled);
          }

          lv_arc_set_value(id(stove_arc_main_timer), 0);

          id(stove_arc_range_initialized) = true;
          ESP_LOGI("stove_ui", "Arc range initialized");

  - id: stove_sync_climate
    then:
      - climate.control:
          id: stove_thermostat
          target_temperature: !lambda |-
            return id(stove_target_temp);

  - id: stove_open_cycle_modal
    then:
      - lambda: |-
          id(stove_cycle_modal_open) = true;
          ESP_LOGI("stove_ui", "Open cycle modal");
      - lvgl.widget.show: stove_cycle_modal_overlay
      - lvgl.widget.show: stove_cycle_modal
      - lambda: |-
          lv_obj_move_foreground(id(stove_cycle_modal_overlay));
          lv_obj_move_foreground(id(stove_cycle_modal));

  - id: stove_close_cycle_modal
    then:
      - lambda: |-
          id(stove_cycle_modal_open) = false;
          id(stove_alarm_blink_state) = false;
          ESP_LOGI("stove_ui", "Close cycle modal");
      - lvgl.widget.hide: stove_cycle_modal
      - lvgl.widget.hide: stove_cycle_modal_overlay

  - id: stove_open_settings_panel
    then:
      - lambda: |-
          id(stove_hysteresis_edit) = id(stove_hysteresis);
          id(stove_settings_open) = true;
          ESP_LOGI("stove_ui", "Open hysteresis panel: current=%d", id(stove_hysteresis));
      - lvgl.widget.show: stove_settings_overlay
      - lvgl.widget.show: stove_settings_panel
      - lambda: |-
          lv_obj_move_foreground(id(stove_settings_overlay));
          lv_obj_move_foreground(id(stove_settings_panel));
          lv_obj_set_x(id(stove_settings_panel), -lv_obj_get_width(id(stove_settings_panel)));

          lv_anim_t a;
          lv_anim_init(&a);
          lv_anim_set_var(&a, id(stove_settings_panel));
          lv_anim_set_values(&a, -lv_obj_get_width(id(stove_settings_panel)), 0);
          lv_anim_set_time(&a, 300);
          lv_anim_set_exec_cb(&a, (lv_anim_exec_xcb_t) lv_obj_set_x);
          lv_anim_set_path_cb(&a, lv_anim_path_ease_out);
          lv_anim_start(&a);
      - script.execute: stove_update_ui

  - id: stove_close_settings_panel
    then:
      - lambda: |-
          lv_anim_t a;
          lv_anim_init(&a);
          lv_anim_set_var(&a, id(stove_settings_panel));
          lv_anim_set_values(&a, lv_obj_get_x(id(stove_settings_panel)), -lv_obj_get_width(id(stove_settings_panel)));
          lv_anim_set_time(&a, 300);
          lv_anim_set_exec_cb(&a, (lv_anim_exec_xcb_t) lv_obj_set_x);
          lv_anim_set_path_cb(&a, lv_anim_path_ease_out);
          lv_anim_set_ready_cb(&a, [](lv_anim_t *a) {
            lv_obj_add_flag((lv_obj_t *)a->var, LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(stove_settings_overlay), LV_OBJ_FLAG_HIDDEN);
          });
          lv_anim_start(&a);
          id(stove_settings_open) = false;
          ESP_LOGI("stove_ui", "Close hysteresis panel");

  - id: stove_cancel_hysteresis
    then:
      - lambda: |-
          id(stove_hysteresis_edit) = id(stove_hysteresis);
          ESP_LOGI("stove_ui", "Hysteresis edit cancelled, restored to %d", id(stove_hysteresis));
      - script.execute: stove_close_settings_panel
      - script.execute: stove_update_ui

  - id: stove_toggle_settings_panel
    then:
      - if:
          condition:
            lambda: 'return id(stove_settings_open);'
          then:
            - script.execute: stove_cancel_hysteresis
          else:
            - script.execute: stove_open_settings_panel

  - id: stove_save_hysteresis
    then:
      - lambda: |-
          id(stove_hysteresis) = id(stove_hysteresis_edit);
          ESP_LOGI("stove_ui", "Hysteresis saved: %d", id(stove_hysteresis));
      - script.execute: stove_close_settings_panel
      - script.execute: stove_update_ui

  - id: stove_open_temp_page
    then:
      - lambda: |-
          id(stove_target_temp_edit) = id(stove_target_temp);
          lv_arc_set_value(id(stove_arc_target_edit), id(stove_target_temp_edit));
      - lvgl.page.show: stove_temp_page
      - script.execute: stove_update_ui

  - id: stove_cancel_temp_edit
    then:
      - lambda: |-
          id(stove_target_temp_edit) = id(stove_target_temp);
          lv_arc_set_value(id(stove_arc_target_edit), id(stove_target_temp_edit));
      - lvgl.page.show: stove_main_page
      - script.execute: stove_update_ui

  - id: stove_save_temp_edit
    then:
      - lambda: |-
          id(stove_target_temp) = id(stove_target_temp_edit);
          ESP_LOGI("stove_ui", "Target temperature saved: %d", id(stove_target_temp));
      - script.execute: stove_sync_climate
      - lvgl.page.show: stove_main_page
      - script.execute: stove_update_ui

  - id: stove_open_timer_page
    then:
      - lvgl.roller.update:
          id: stove_timer_hours_roller_page
          selected_index: !lambda 'return id(stove_timer_hours);'
          animated: false
      - lvgl.roller.update:
          id: stove_timer_minutes_roller_page
          selected_index: !lambda 'return id(stove_timer_minutes);'
          animated: false
      - lvgl.page.show: stove_timer_page
      - script.execute: stove_update_ui

  - id: stove_back_to_main_page
    then:
      - lvgl.page.show: stove_main_page
      - script.execute: stove_update_ui

  - id: stove_reset_all
    then:
      - lambda: |-
          id(stove_cycle_running) = false;
          id(stove_hold_started) = false;
          id(stove_cycle_finished) = false;
          id(stove_heating_output_state) = false;
          id(stove_alarm_output_state) = false;
          id(stove_remaining_sec) = 0;
          id(stove_target_temp_edit) = id(stove_target_temp);
          id(stove_timer_invalid) = false;
          id(stove_target_reached_latch_sec) = 0;
          id(stove_ui_user_adjusting_target) = false;
          id(stove_hysteresis_edit) = id(stove_hysteresis);
          id(stove_settings_open) = false;
          id(stove_cycle_modal_open) = false;
          id(stove_alarm_blink_state) = false;
          id(stove_wifi_connected) = false;
          ESP_LOGI("stove_cycle", "Reset all: target=%d hyst=%d timer=%02d:%02d",
                   id(stove_target_temp), id(stove_hysteresis),
                   id(stove_timer_hours), id(stove_timer_minutes));
      - switch.turn_off: stove_heat_relay
      - switch.turn_off: stove_alarm_relay
      - climate.control:
          id: stove_thermostat
          mode: "OFF"
          target_temperature: !lambda |-
            return id(stove_target_temp);
      - lvgl.page.show: stove_main_page
      - lvgl.widget.hide: stove_cycle_modal
      - lvgl.widget.hide: stove_cycle_modal_overlay
      - lambda: |-
          lv_arc_set_value(id(stove_arc_target_edit), id(stove_target_temp_edit));
          lv_arc_set_value(id(stove_arc_main_timer), 0);
      - lvgl.roller.update:
          id: stove_timer_hours_roller_page
          selected_index: !lambda 'return id(stove_timer_hours);'
          animated: false
      - lvgl.roller.update:
          id: stove_timer_minutes_roller_page
          selected_index: !lambda 'return id(stove_timer_minutes);'
          animated: false
      - script.execute: stove_update_ui

  - id: stove_update_ui
    then:
      - lambda: |-
          {
            char buf[16];
            snprintf(buf, sizeof(buf), "%d°", id(stove_hysteresis_edit));
            lv_label_set_text(id(stove_hysteresis_value_label), buf);
          }

          {
            char buf[16];
            snprintf(buf, sizeof(buf), "%d°", id(stove_target_temp_edit));
            lv_label_set_text(id(stove_temp_page_edit_label), buf);
            lv_arc_set_value(id(stove_arc_target_edit), id(stove_target_temp_edit));
          }

          {
            char buf[16];
            snprintf(buf, sizeof(buf), "%d°", id(stove_target_temp));
            lv_label_set_text(id(stove_main_target_temp_label), buf);
          }

          {
            char buf[24];
            if (id(${stove_temp_sensor_id}).has_state()) {
              float current = id(${stove_temp_sensor_id}).state;
              int minv = ${stove_min_temp};
              int maxv = id(stove_target_temp);
              if (maxv < minv + 1) maxv = minv + 1;
              int arc_current = (int)(current + 0.5f);
              if (arc_current < minv) arc_current = minv;
              if (arc_current > maxv) arc_current = maxv;
              lv_arc_set_range(id(stove_arc_main_current), minv, maxv);
              lv_arc_set_value(id(stove_arc_main_current), arc_current);

              snprintf(buf, sizeof(buf), "%.1f°", current);
              lv_label_set_text(id(stove_main_current_temp_label), buf);
              lv_label_set_text(id(stove_temp_page_current_label), buf);
            } else {
              int minv = ${stove_min_temp};
              int maxv = id(stove_target_temp);
              if (maxv < minv + 1) maxv = minv + 1;
              lv_arc_set_range(id(stove_arc_main_current), minv, maxv);
              lv_arc_set_value(id(stove_arc_main_current), minv);
              snprintf(buf, sizeof(buf), "--.-°");
              lv_label_set_text(id(stove_main_current_temp_label), buf);
              lv_label_set_text(id(stove_temp_page_current_label), buf);
            }
          }

          {
            int set_total = (id(stove_timer_hours) * 3600) + (id(stove_timer_minutes) * 60);
            int elapsed = 0;
            int remaining = 0;

            if (id(stove_cycle_running) && id(stove_hold_started)) {
              remaining = id(stove_remaining_sec);
              elapsed = set_total - remaining;
              if (elapsed < 0) elapsed = 0;
            } else if (id(stove_cycle_finished)) {
              remaining = 0;
              elapsed = set_total;
            } else {
              remaining = set_total;
              elapsed = 0;
            }

            int scaled = 0;
            if (set_total > 0) {
              scaled = (elapsed * 1000) / set_total;
              if (scaled < 0) scaled = 0;
              if (scaled > 1000) scaled = 1000;
            }
            lv_arc_set_value(id(stove_arc_main_timer), scaled);

            char buf_remaining[24];
            int hh = remaining / 3600;
            int mm = (remaining % 3600) / 60;
            int ss = remaining % 60;
            snprintf(buf_remaining, sizeof(buf_remaining), "%02d:%02d:%02d", hh, mm, ss);
            lv_label_set_text(id(stove_main_remaining_label), buf_remaining);
          }

          if (id(stove_timer_invalid)) {
            lv_label_set_text(id(stove_top_status_label), "ЗАДАЙТЕ ТАЙМЕР");
            lv_obj_set_style_text_color(id(stove_top_status_label), lv_color_hex(0xFF3B30), 0);
            lv_label_set_text(id(stove_modal_status_label), "ЦИКЛ ОКОНЧЕН");
          } else if (id(stove_cycle_finished)) {
            lv_label_set_text(id(stove_top_status_label), "ЦИКЛ ОКОНЧЕН");
            lv_obj_set_style_text_color(id(stove_top_status_label), lv_color_hex(0x34C759), 0);
            lv_label_set_text(id(stove_modal_status_label), "ЦИКЛ ОКОНЧЕН");
          } else if (id(stove_cycle_running) && id(stove_hold_started)) {
            lv_label_set_text(id(stove_top_status_label), "ВЫДЕРЖКА");
            lv_obj_set_style_text_color(id(stove_top_status_label), lv_color_hex(0xFFD60A), 0);
          } else if (id(stove_cycle_running) && id(stove_target_reached_latch_sec) > 0) {
            char buf[32];
            snprintf(buf, sizeof(buf), "СТАБИЛИЗАЦИЯ %d/%d",
                     id(stove_target_reached_latch_sec),
                     ${stove_reach_stable_seconds});
            lv_label_set_text(id(stove_top_status_label), buf);
            lv_obj_set_style_text_color(id(stove_top_status_label), lv_color_hex(0xFFD60A), 0);
          } else if (id(stove_cycle_running)) {
            lv_label_set_text(id(stove_top_status_label), "НАГРЕВ");
            lv_obj_set_style_text_color(id(stove_top_status_label), lv_color_hex(0xFF6600), 0);
          } else {
            lv_label_set_text(id(stove_top_status_label), "ОЖИДАНИЕ");
            lv_obj_set_style_text_color(id(stove_top_status_label), lv_color_hex(0xC7D0E0), 0);
          }

          if (id(stove_cycle_running) || id(stove_cycle_finished)) {
            lv_label_set_text(id(stove_main_start_stop_label), "СТОП");
            lv_obj_set_style_text_color(id(stove_main_start_stop_label), lv_color_hex(0xFF3B30), 0);
          } else {
            lv_label_set_text(id(stove_main_start_stop_label), "СТАРТ");
            lv_obj_set_style_text_color(id(stove_main_start_stop_label), lv_color_hex(0x34C759), 0);
          }

          if (id(stove_cycle_finished)) {
            if (!id(stove_cycle_modal_open)) {
              id(stove_cycle_modal_open) = true;
            }
            lv_obj_clear_flag(id(stove_cycle_modal), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(stove_cycle_modal_overlay), LV_OBJ_FLAG_HIDDEN);

            if (id(stove_alarm_blink_state)) {
              lv_obj_set_style_text_color(id(stove_modal_alarm_big), lv_color_hex(0xFF3B30), 0);
            } else {
              lv_obj_set_style_text_color(id(stove_modal_alarm_big), lv_color_hex(0x5A1A18), 0);
            }
          } else {
            lv_obj_add_flag(id(stove_cycle_modal), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(stove_cycle_modal_overlay), LV_OBJ_FLAG_HIDDEN);
          }

          if (id(stove_wifi_connected)) {
            lv_obj_set_style_text_color(id(stove_wifi_icon_ui), lv_color_hex(0x34C759), 0);
          } else {
            lv_obj_set_style_text_color(id(stove_wifi_icon_ui), lv_color_hex(0x808080), 0);
          }
