substitutions:
  display_name: "stove"
  stove_name: "Печь"
  stove_temp_sensor_id: max6675_temp

  stove_min_temp: "5"
  stove_max_temp: "200"
  stove_temp_step: "1"
  stove_default_temp: "35"
  stove_default_hysteresis: "3"
  stove_reach_stable_seconds: "5"

  plus_icon: "\U000F0415"
  minus_icon: "\U000F0374"
  settings_icon: "\U000F08BB"
  alarm_icon: "\U000F009E"
  wifi_icon: "\U000F05A9"
  back_icon: "\U000F0156"

color:
  - id: color_primary
    hex: 343645
  - id: color_secondary
    hex: 606682
  - id: color_text
    hex: 9BA2BC
  - id: color_black
    hex: 0d0d0d
  - id: color_white
    hex: f2f0eb
  - id: color_red
    hex: ff0000
  - id: color_blue
    hex: 4C9FFF
  - id: color_yellow
    hex: e7c12c
  - id: color_green
    hex: 5CA848
  - id: color_orange
    hex: ff6600

font:
  # TEXT FONT

  - file: "assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_20
    size: 20
    bpp: 4
    glyphsets:
      - GF_Cyrillic_Core

  - file: "assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_26
    size: 26
    bpp: 4
    glyphsets:
      - GF_Cyrillic_Core

  - file: "assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_30
    size: 30
    bpp: 4
    glyphsets:
      - GF_Cyrillic_Core

  - file: "assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_36
    size: 36
    bpp: 4
    glyphsets:
      - GF_Cyrillic_Core


  - file: "assets/fonts/Nunito-SemiBold.ttf"
    id: nunito_56
    size: 56
    bpp: 4
    glyphs: [ 0123456789° ]


  # ICONS FONT

  - file: "assets/fonts/materialdesignicons-webfont.ttf"
    id: mdi_icons_28
    size: 28
    bpp: 4
    glyphs: [
      "\U000F05A9", # wifi
      "\U000F0156", # close
      "\U000F08BB", # settings
    ]

  - file: "assets/fonts/materialdesignicons-webfont.ttf"
    id: mdi_icons_40
    size: 40
    bpp: 4
    glyphs: [
      "\U000F0415", # plus
      "\U000F0374", # minus
    ]

  - file: "assets/fonts/materialdesignicons-webfont.ttf"
    id: mdi_icons_120
    size: 120
    bpp: 4
    glyphs: [
      "\U000F009E", # bell/alarm
    ]

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_SPIRAM_RODATA: n

api:


esphome:
  name: ${display_name}
  on_boot:
    priority: -10
    then:
      - lambda: |-
          ESP_LOGI("stove_boot", "Boot: forcing relays OFF and resetting stove state");
      - switch.turn_off: stove_heat_relay
      - switch.turn_off: stove_alarm_relay
      - climate.control:
          id: stove_thermostat
          mode: "OFF"
          target_temperature: ${stove_default_temp}
      - script.execute: stove_reset_all
      - script.execute: stove_update_arc_range
      - script.execute: stove_update_ui

psram:
  mode: octal
  speed: 80MHz

logger:
  level: debug
  logs:
    lvgl: info
  hardware_uart: UART0

wifi:
  ap:
    ssid: "Stove-Hotspot"
    password: "01234567"
  on_connect:
    then:
      - lambda: |-
          id(stove_wifi_connected) = true;
      - script.execute: stove_update_ui
  on_disconnect:
    then:
      - lambda: |-
          id(stove_wifi_connected) = false;
      - script.execute: stove_update_ui

captive_portal:

web_server:
  port: 80

light:
  - platform: monochromatic
    output: backlight_output
    name: Backlight
    id: display_backlight
    restore_mode: ALWAYS_ON

output:
  - platform: ledc
    pin: GPIO38
    id: backlight_output
    frequency: 100Hz

i2c:
  - id: bus_a
    sda: GPIO19
    scl:
      number: GPIO45
      ignore_strapping_warning: true
    frequency: 100kHz

touchscreen:
  platform: gt911
  id: touchscreen_id
  transform:
    mirror_x: false
    mirror_y: false
  display: ${display_name}

spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47
    miso_pin: GPIO41

display:
  - platform: st7701s
    id: ${display_name}
    update_interval: never
    auto_clear_enabled: false
    data_rate: 2MHz
    spi_id: lcd_spi
    spi_mode: MODE3
    color_order: RGB
    invert_colors: false
    dimensions:
      width: 480
      height: 480
    transform:
      mirror_x: false
      mirror_y: false
    cs_pin: 39
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    init_sequence:
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCD, 0x00]
    pclk_frequency: 12MHz
    pclk_inverted: false
    data_pins:
      red: [11, 12, 13, 14, 0]
      green: [8, 20, 3, 46, 9, 10]
      blue: [4, 5, 6, 7, 15]

globals:
  - id: stove_arc_range_initialized
    type: bool
    restore_value: no
    initial_value: "false"

  - id: stove_ui_user_adjusting_target
    type: bool
    restore_value: no
    initial_value: "false"

  - id: stove_target_temp
    type: int
    restore_value: yes
    initial_value: "${stove_default_temp}"

  - id: stove_target_temp_edit
    type: int
    restore_value: no
    initial_value: "${stove_default_temp}"

  - id: stove_hysteresis
    type: int
    restore_value: yes
    initial_value: "${stove_default_hysteresis}"

  - id: stove_hysteresis_edit
    type: int
    restore_value: no
    initial_value: "${stove_default_hysteresis}"

  - id: stove_timer_hours
    type: int
    restore_value: yes
    initial_value: "0"

  - id: stove_timer_minutes
    type: int
    restore_value: yes
    initial_value: "0"

  - id: stove_remaining_sec
    type: int
    restore_value: no
    initial_value: "0"

  - id: stove_cycle_running
    type: bool
    restore_value: no
    initial_value: "false"

  - id: stove_hold_started
    type: bool
    restore_value: no
    initial_value: "false"

  - id: stove_cycle_finished
    type: bool
    restore_value: no
    initial_value: "false"

  - id: stove_heating_output_state
    type: bool
    restore_value: no
    initial_value: "false"

  - id: stove_alarm_output_state
    type: bool
    restore_value: no
    initial_value: "false"

  - id: stove_settings_open
    type: bool
    restore_value: no
    initial_value: "false"

  - id: stove_cycle_modal_open
    type: bool
    restore_value: no
    initial_value: "false"

  - id: stove_alarm_blink_state
    type: bool
    restore_value: no
    initial_value: "false"

  - id: stove_last_temp
    type: float
    restore_value: no
    initial_value: "0"

  - id: stove_timer_invalid
    type: bool
    restore_value: no
    initial_value: "false"

  - id: stove_target_reached_latch_sec
    type: int
    restore_value: no
    initial_value: "0"

  - id: stove_wifi_connected
    type: bool
    restore_value: no
    initial_value: "false"

text_sensor:
  - platform: template
    id: stove_status_text
    name: "Stove Status"
    lambda: |-
      if (id(stove_timer_invalid)) return {"Задайте таймер"};
      if (id(stove_cycle_finished)) return {"Цикл окончен"};
      if (id(stove_cycle_running) && id(stove_hold_started)) return {"Выдержка"};
      if (id(stove_cycle_running) && id(stove_target_reached_latch_sec) > 0) return {"Стабилизация"};
      if (id(stove_cycle_running)) return {"Нагрев"};
      return {"Ожидание"};

switch:
  - platform: gpio
    id: stove_heat_relay
    name: "Stove Heat Relay"
    pin: GPIO40
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: |-
          ESP_LOGI("stove_relay", "HEAT relay -> ON (GPIO40)");
      - script.execute: stove_update_ui
    on_turn_off:
      - lambda: |-
          ESP_LOGI("stove_relay", "HEAT relay -> OFF (GPIO40)");
      - script.execute: stove_update_ui

  - platform: gpio
    id: stove_alarm_relay
    name: "Stove Alarm Relay"
    pin: GPIO1
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: |-
          ESP_LOGI("stove_relay", "ALARM relay -> ON (GPIO01)");
      - script.execute: stove_update_ui
    on_turn_off:
      - lambda: |-
          ESP_LOGI("stove_relay", "ALARM relay -> OFF (GPIO01)");
      - script.execute: stove_update_ui

sensor:
  - platform: max6675
    id: max6675_temp
    name: "Температура термопары"
    spi_id: lcd_spi
    cs_pin: GPIO42
    update_interval: 1s
    on_value:
      - lambda: |-
          id(stove_last_temp) = x;
          ESP_LOGD("stove_temp", "MAX6675 temperature updated: %.2f", x);
      - script.execute: stove_update_ui

  - platform: template
    id: stove_remaining_minutes_sensor
    name: "Stove Remaining Minutes"
    unit_of_measurement: "min"
    accuracy_decimals: 1
    lambda: |-
      return id(stove_remaining_sec) / 60.0f;

  - platform: wifi_signal
    id: stove_wifi_signal
    name: "Stove WiFi Signal"
    update_interval: 30s
    on_value:
      - lambda: |-
          id(stove_wifi_connected) = true;
      - script.execute: stove_update_ui

climate:
  - platform: thermostat
    id: stove_thermostat
    name: "${stove_name}"
    sensor: ${stove_temp_sensor_id}

    min_heating_off_time: 1s
    min_heating_run_time: 1s
    min_idle_time: 1s

    visual:
      min_temperature: ${stove_min_temp}
      max_temperature: ${stove_max_temp}
      temperature_step: ${stove_temp_step}

    startup_delay: true
    heat_deadband: 0.5
    heat_overrun: 0.5

    heat_action:
      - lambda: |-
          ESP_LOGI("stove_climate", "Thermostat heat_action fired");

    idle_action:
      - lambda: |-
          ESP_LOGI("stove_climate", "Thermostat idle_action fired");

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(${stove_temp_sensor_id}).has_state()) {
            id(stove_last_temp) = id(${stove_temp_sensor_id}).state;
          }

          bool prev_heat = id(stove_heating_output_state);
          bool prev_alarm = id(stove_alarm_output_state);

          if (id(stove_cycle_finished) && id(stove_cycle_modal_open)) {
            id(stove_alarm_blink_state) = !id(stove_alarm_blink_state);
          } else {
            id(stove_alarm_blink_state) = false;
          }

          if (!id(stove_cycle_running)) {
            if (id(stove_target_reached_latch_sec) != 0 || id(stove_heating_output_state)) {
              ESP_LOGD("stove_logic", "Cycle not running -> reset latch and heating request");
            }
            id(stove_target_reached_latch_sec) = 0;
            id(stove_heating_output_state) = false;
          } else if (!id(${stove_temp_sensor_id}).has_state()) {
            ESP_LOGW("stove_logic", "No temperature state -> heating request OFF");
            id(stove_target_reached_latch_sec) = 0;
            id(stove_heating_output_state) = false;
          } else {
            float current = id(${stove_temp_sensor_id}).state;
            float target = id(stove_target_temp);
            float h = id(stove_hysteresis);

            if (!id(stove_hold_started)) {
              if (current >= target) {
                id(stove_target_reached_latch_sec)++;
                ESP_LOGD("stove_logic", "Target reached latch: %d/%d (current=%.2f target=%.2f)",
                         id(stove_target_reached_latch_sec), ${stove_reach_stable_seconds}, current, target);
              } else {
                if (id(stove_target_reached_latch_sec) != 0) {
                  ESP_LOGD("stove_logic", "Latch reset because current %.2f < target %.2f", current, target);
                }
                id(stove_target_reached_latch_sec) = 0;
              }

              if (id(stove_target_reached_latch_sec) >= ${stove_reach_stable_seconds}) {
                id(stove_hold_started) = true;
                id(stove_remaining_sec) = (id(stove_timer_hours) * 3600) + (id(stove_timer_minutes) * 60);
                id(stove_target_reached_latch_sec) = 0;
                ESP_LOGI("stove_cycle", "Hold started: timer=%d sec", id(stove_remaining_sec));
              }
            }

            if (!id(stove_cycle_finished)) {
              float low_border = target - h;
              float high_border = target + h;

              if (current <= low_border) {
                if (!id(stove_heating_output_state)) {
                  ESP_LOGI("stove_logic",
                           "Heating request ON: current=%.2f target=%.2f low=%.2f high=%.2f",
                           current, target, low_border, high_border);
                }
                id(stove_heating_output_state) = true;
              } else if (current >= high_border) {
                if (id(stove_heating_output_state)) {
                  ESP_LOGI("stove_logic",
                           "Heating request OFF: current=%.2f target=%.2f low=%.2f high=%.2f",
                           current, target, low_border, high_border);
                }
                id(stove_heating_output_state) = false;
              }
            }

            if (id(stove_hold_started) && id(stove_remaining_sec) > 0) {
              id(stove_remaining_sec)--;
            }

            if (id(stove_hold_started) && id(stove_remaining_sec) <= 0) {
              id(stove_remaining_sec) = 0;
              id(stove_cycle_running) = false;
              id(stove_hold_started) = false;
              id(stove_cycle_finished) = true;
              id(stove_heating_output_state) = false;
              id(stove_alarm_output_state) = true;
              ESP_LOGI("stove_cycle", "Cycle finished -> heating OFF, alarm ON");
            }
          }

          if (prev_heat != id(stove_heating_output_state)) {
            if (id(stove_heating_output_state)) {
              id(stove_heat_relay).turn_on();
            } else {
              id(stove_heat_relay).turn_off();
            }
          }

          if (prev_alarm != id(stove_alarm_output_state)) {
            if (id(stove_alarm_output_state)) {
              id(stove_alarm_relay).turn_on();
            } else {
              id(stove_alarm_relay).turn_off();
            }
          }

          if (id(stove_cycle_finished) && !id(stove_cycle_modal_open)) {
            id(stove_cycle_modal_open) = true;
          }

      - script.execute: stove_update_ui

lvgl:
  id: lvgl_component
  color_depth: 16
  byte_order: big_endian
  displays: ${display_name}
  touchscreens:
    - touchscreen_id: touchscreen_id

  top_layer:
    widgets:
      - obj:
          id: stove_settings_overlay
          hidden: true
          x: 0
          y: 0
          width: 480
          height: 480
          align: top_left
          clickable: true
          bg_opa: transp
          border_opa: transp
          border_width: 0
          shadow_opa: transp
          on_click:
            - if:
                condition:
                  lambda: 'return id(stove_settings_open);'
                then:
                  - script.execute: stove_cancel_hysteresis

      - obj:
          id: stove_settings_panel
          hidden: true
          x: -210
          y: 0
          width: 210
          height: 480
          align: top_left
          pad_all: 0
          bg_color: color_primary
          border_opa: transp
          border_width: 0
          radius: 0
          shadow_color: color_black
          shadow_ofs_x: 10
          shadow_ofs_y: 0
          shadow_spread: 0
          shadow_width: 8
          shadow_opa: 45%
          widgets:
            - label:
                id: stove_hyst_title
                x: 0
                y: 28
                width: 210
                align: top_left
                text_align: center
                text_font: nunito_26
                text_color: color_white
                text: "Гистерезис"

            - label:
                id: stove_hysteresis_value_label
                x: 0
                y: 78
                width: 210
                align: top_left
                text_align: center
                text_font: nunito_36
                text_color: color_text
                text: "3°"

            - obj:
                x: 60
                y: 150
                width: 90
                height: 90
                align: top_left
                pad_all: 0
                bg_opa: transp
                border_opa: transp
                border_width: 0
                shadow_opa: transp
                widgets:
                  - obj:
                      width: 70
                      height: 70
                      align: center
                      clickable: true
                      radius: 50
                      pad_all: 0
                      bg_opa: transp
                      border_opa: transp
                      border_width: 0
                      shadow_width: 8
                      shadow_spread: 2
                      shadow_color: color_black
                      pressed:
                        bg_color: color_black
                        shadow_width: 5
                      on_press:
                        - lambda: |-
                            id(stove_hysteresis_edit)++;
                            if (id(stove_hysteresis_edit) > 30) id(stove_hysteresis_edit) = 30;
                        - script.execute: stove_update_ui
                  - obj:
                      width: 65
                      height: 65
                      pad_all: 0
                      align: center
                      clickable: false
                      radius: 50
                      border_opa: transp
                      border_width: 0
                      bg_color: color_primary
                      widgets:
                        - label:
                            align: center
                            text_font: mdi_icons_40
                            text_color: color_text
                            text: "${plus_icon}"

            - obj:
                x: 60
                y: 255
                width: 90
                height: 90
                align: top_left
                pad_all: 0
                bg_opa: transp
                border_opa: transp
                border_width: 0
                shadow_opa: transp
                widgets:
                  - obj:
                      width: 70
                      height: 70
                      align: center
                      clickable: true
                      radius: 50
                      pad_all: 0
                      bg_opa: transp
                      border_opa: transp
                      border_width: 0
                      shadow_width: 8
                      shadow_spread: 2
                      shadow_color: color_black
                      pressed:
                        bg_color: color_black
                        shadow_width: 5
                      on_press:
                        - lambda: |-
                            id(stove_hysteresis_edit)--;
                            if (id(stove_hysteresis_edit) < 1) id(stove_hysteresis_edit) = 1;
                        - script.execute: stove_update_ui
                  - obj:
                      width: 65
                      height: 65
                      pad_all: 0
                      align: center
                      clickable: false
                      radius: 50
                      border_opa: transp
                      border_width: 0
                      bg_color: color_primary
                      widgets:
                        - label:
                            align: center
                            text_font: mdi_icons_40
                            text_color: color_text
                            text: "${minus_icon}"

            - obj:
                x: 0
                y: 375
                width: 150
                height: 70
                align: top_mid
                pad_all: 0
                bg_opa: transp
                border_opa: transp
                border_width: 0
                shadow_opa: transp
                widgets:
                  - obj:
                      width: 130
                      height: 50
                      align: center
                      clickable: true
                      radius: 12
                      pad_all: 0
                      bg_opa: transp
                      border_opa: transp
                      border_width: 0
                      shadow_width: 8
                      shadow_spread: 2
                      shadow_color: color_black
                      pressed:
                        bg_color: color_black
                        shadow_width: 5
                      on_press:
                        - script.execute: stove_save_hysteresis
                  - obj:
                      width: 130
                      height: 50
                      pad_all: 0
                      align: center
                      clickable: false
                      radius: 12
                      border_opa: transp
                      border_width: 0
                      bg_color: color_primary
                      widgets:
                        - label:
                            align: center
                            text_font: nunito_20
                            text_color: color_text
                            text: "Сохранить"

      - obj:
          id: stove_cycle_modal_overlay
          hidden: true
          x: 0
          y: 0
          width: 480
          height: 480
          align: top_left
          clickable: true
          bg_color: color_black
          bg_opa: 35%
          border_opa: transp
          border_width: 0
          shadow_opa: transp

      - obj:
          id: stove_cycle_modal
          hidden: true
          width: 440
          height: 440
          align: center
          pad_all: 0
          radius: 24
          bg_color: color_primary
          border_opa: transp
          border_width: 0
          shadow_color: color_black
          shadow_width: 20
          shadow_spread: 2
          shadow_opa: 40%
          widgets:
            - label:
                id: stove_modal_status_label
                x: 0
                y: 30
                width: 380
                align: top_mid
                text_align: center
                text_font: nunito_36
                text_color: color_white
                text: "ЦИКЛ ОКОНЧЕН"

            - label:
                id: stove_modal_alarm_big
                x: 0
                y: 140
                width: 380
                align: top_mid
                text_align: center
                text_font: mdi_icons_120
                text_color: color_red
                text: "${alarm_icon}"

            - obj:
                x: 0
                y: -30
                width: 180
                height: 80
                align: bottom_mid
                pad_all: 0
                bg_opa: transp
                border_opa: transp
                border_width: 0
                shadow_opa: transp
                widgets:
                  - obj:
                      width: 140
                      height: 60
                      align: center
                      clickable: true
                      radius: 12
                      pad_all: 0
                      bg_opa: transp
                      border_opa: transp
                      border_width: 0
                      shadow_width: 8
                      shadow_spread: 2
                      shadow_color: color_black
                      pressed:
                        bg_color: color_black
                        shadow_width: 5
                      on_press:
                        - script.execute: stove_close_cycle_modal
                        - script.execute: stove_reset_all
                  - obj:
                      width: 140
                      height: 60
                      pad_all: 0
                      align: center
                      clickable: false
                      radius: 12
                      border_opa: transp
                      border_width: 0
                      bg_color: color_primary
                      widgets:
                        - label:
                            align: center
                            text_font: nunito_20
                            text_color: color_red
                            text: "СТОП"

  pages:
    - id: stove_main_page
      bg_color: color_primary
      scrollable: false
      widgets:
        - obj:
            id: stove_top_bar
            x: 0
            y: 0
            width: 480
            height: 80
            align: top_left
            pad_all: 0
            bg_color: color_primary
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            scrollable: false
            radius: 0
            widgets:
              - label:
                  id: stove_wifi_icon_ui
                  x: 20
                  y: 26
                  align: top_left
                  text_font: mdi_icons_28
                  text_color: 0x808080
                  text: "${wifi_icon}"

              - label:
                  id: stove_top_status_label
                  x: 0
                  y: 24
                  width: 320
                  height: 80
                  align: center
